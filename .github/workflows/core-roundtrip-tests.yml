name: Core round-trip regressions

on:
  push:
    branches:
      - chibi-robo/core-roundtrip
  workflow_dispatch:

jobs:
  pure-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy pillow

      - name: Run core round-trip regressions
        run: >
          python -m pytest -q
          tests/test_describe_meshes.py
          tests/test_describe_envelope.py
          tests/test_compose_envelope_consistency.py
          tests/test_merge_meshes.py
          tests/test_plan_meshes.py
          tests/test_chibi_robo_roundtrip_metadata.py
          tests/test_chibi_robo_nrm_clr0.py
          tests/test_describe_normals_export.py
          tests/test_build_mesh_instances.py
          tests/test_mesh_normal_fingerprint.py
          tests/test_chibi_robo_source_animation.py
